{{- if .Values.simulation.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pitch.fullname" . }}-simulation
  labels:
    {{- include "pitch.labels" . | nindent 4 }}
    app.kubernetes.io/component: simulation
spec:
  {{- if not .Values.simulation.autoscaling.enabled }}
  replicas: {{ .Values.simulation.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "pitch.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: simulation
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
      labels:
        {{- include "pitch.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: simulation
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "pitch.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
      - name: wait-for-postgres
        image: busybox:1.35
        command: ['sh', '-c', 'until nc -z {{ include "pitch.fullname" . }}-postgres-simulation 5432; do echo waiting for postgres; sleep 2; done;']
      - name: wait-for-mongodb
        image: busybox:1.35
        command: ['sh', '-c', 'until nc -z {{ include "pitch.fullname" . }}-mongodb 27017; do echo waiting for mongodb; sleep 2; done;']
      - name: wait-for-rabbitmq
        image: busybox:1.35
        command: ['sh', '-c', 'until nc -z {{ include "pitch.fullname" . }}-rabbitmq 5672; do echo waiting for rabbitmq; sleep 2; done;']
      containers:
      - name: simulation
        securityContext:
          {{- toYaml .Values.securityContext | nindent 12 }}
        image: {{ include "pitch.image" . }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        env:
        - name: SERVICE_NAME
          value: {{ .Values.simulation.serviceName | quote }}
        - name: NODE_ENV
          value: "production"
        - name: SIMULATION_DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.existingSecret | default (printf "%s-secrets" (include "pitch.fullname" .)) }}
              key: simulation-database-url
        - name: MONGODB_URL
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.existingSecret | default (printf "%s-secrets" (include "pitch.fullname" .)) }}
              key: mongodb-url
        - name: REDIS_URL
          value: {{ include "pitch.redis.connectionString" . | quote }}
        - name: RABBITMQ_URL
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.existingSecret | default (printf "%s-secrets" (include "pitch.fullname" .)) }}
              key: rabbitmq-url
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.existingSecret | default (printf "%s-secrets" (include "pitch.fullname" .)) }}
              key: openai-api-key
              optional: true
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.existingSecret | default (printf "%s-secrets" (include "pitch.fullname" .)) }}
              key: anthropic-api-key
              optional: true
        - name: DEEPGRAM_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.existingSecret | default (printf "%s-secrets" (include "pitch.fullname" .)) }}
              key: deepgram-api-key
              optional: true
        - name: ELEVENLABS_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.existingSecret | default (printf "%s-secrets" (include "pitch.fullname" .)) }}
              key: elevenlabs-api-key
              optional: true
        resources:
          {{- toYaml .Values.simulation.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}

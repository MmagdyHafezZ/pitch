{{- if not .Values.secrets.existingSecret -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pitch.fullname" . }}-secrets
  labels:
    {{- include "pitch.labels" . | nindent 4 }}
type: Opaque
stringData:
  # PostgreSQL
  postgres-username: {{ .Values.postgresql.auth.username | quote }}
  postgres-password: {{ .Values.postgresql.auth.password | required "postgresql.auth.password is required" | quote }}

  # Database connection strings
  user-database-url: {{ include "pitch.postgresql.user.connectionString" . | quote }}
  simulation-database-url: {{ include "pitch.postgresql.simulation.connectionString" . | quote }}
  support-database-url: {{ include "pitch.postgresql.support.connectionString" . | quote }}
  analytics-database-url: {{ include "pitch.postgresql.analytics.connectionString" . | quote }}
  lti-database-url: {{ include "pitch.postgresql.lti.connectionString" . | quote }}
  s3-database-url: {{ include "pitch.postgresql.s3.connectionString" . | quote }}

  # MongoDB
  mongodb-root-user: {{ .Values.mongodb.auth.rootUser | quote }}
  mongodb-root-password: {{ .Values.mongodb.auth.rootPassword | required "mongodb.auth.rootPassword is required" | quote }}
  mongodb-url: {{ include "pitch.mongodb.connectionString" . | quote }}

  # RabbitMQ
  rabbitmq-user: {{ .Values.rabbitmq.auth.username | quote }}
  rabbitmq-password: {{ .Values.rabbitmq.auth.password | required "rabbitmq.auth.password is required" | quote }}
  rabbitmq-url: {{ include "pitch.rabbitmq.connectionString" . | quote }}

  # JWT
  jwt-secret: {{ .Values.secrets.jwtSecret | required "secrets.jwtSecret is required" | quote }}

  # OAuth (optional)
  google-client-id: {{ .Values.secrets.googleClientId | default "" | quote }}
  google-client-secret: {{ .Values.secrets.googleClientSecret | default "" | quote }}
  microsoft-client-id: {{ .Values.secrets.microsoftClientId | default "" | quote }}
  microsoft-client-secret: {{ .Values.secrets.microsoftClientSecret | default "" | quote }}

  # AI/LLM API keys (optional)
  openai-api-key: {{ .Values.secrets.openaiApiKey | default "" | quote }}
  anthropic-api-key: {{ .Values.secrets.anthropicApiKey | default "" | quote }}
  deepgram-api-key: {{ .Values.secrets.deepgramApiKey | default "" | quote }}
  elevenlabs-api-key: {{ .Values.secrets.elevenlabsApiKey | default "" | quote }}

  # AWS (optional)
  aws-access-key-id: {{ .Values.secrets.awsAccessKeyId | default "" | quote }}
  aws-secret-access-key: {{ .Values.secrets.awsSecretAccessKey | default "" | quote }}
  aws-s3-bucket: {{ .Values.secrets.awsS3Bucket | default "" | quote }}

  # LTI (optional)
  lti-platform-url: {{ .Values.secrets.ltiPlatformUrl | default "" | quote }}
  lti-client-id: {{ .Values.secrets.ltiClientId | default "" | quote }}
  lti-deployment-id: {{ .Values.secrets.ltiDeploymentId | default "" | quote }}
{{- end }}

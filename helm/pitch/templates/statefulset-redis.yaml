{{- if .Values.redis.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pitch.fullname" . }}-redis
  labels:
    {{- include "pitch.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  ports:
  - port: {{ .Values.redis.service.port }}
    name: redis
  clusterIP: None
  selector:
    {{- include "pitch.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "pitch.fullname" . }}-redis
  labels:
    {{- include "pitch.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  serviceName: {{ include "pitch.fullname" . }}-redis
  replicas: 1
  selector:
    matchLabels:
      {{- include "pitch.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        {{- include "pitch.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: redis
    spec:
      containers:
      - name: redis
        image: {{ .Values.redis.image.registry }}/{{ .Values.redis.image.repository }}:{{ .Values.redis.image.tag }}
        command:
        - redis-server
        - --maxmemory
        - {{ .Values.redis.configuration.maxmemory | quote }}
        - --maxmemory-policy
        - {{ index .Values.redis.configuration "maxmemory-policy" | quote }}
        - --appendonly
        - {{ .Values.redis.configuration.appendonly | quote }}
        ports:
        - containerPort: {{ .Values.redis.service.port }}
          name: redis
        livenessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - name: data
          mountPath: /data
        resources:
          {{- toYaml .Values.redis.resources | nindent 12 }}
  {{- if .Values.redis.persistence.enabled }}
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      {{- if .Values.global.storageClass }}
      storageClassName: {{ .Values.global.storageClass | quote }}
      {{- end }}
      resources:
        requests:
          storage: {{ .Values.redis.persistence.size }}
  {{- else }}
  volumes:
  - name: data
    emptyDir: {}
  {{- end }}
{{- end }}

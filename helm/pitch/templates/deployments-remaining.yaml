{{- if .Values.support.enabled -}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pitch.fullname" . }}-support
  labels:
    {{- include "pitch.labels" . | nindent 4 }}
    app.kubernetes.io/component: support
spec:
  {{- if not .Values.support.autoscaling.enabled }}
  replicas: {{ .Values.support.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "pitch.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: support
  template:
    metadata:
      labels:
        {{- include "pitch.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: support
    spec:
      serviceAccountName: {{ include "pitch.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
      - name: support
        image: {{ include "pitch.image" . }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        env:
        - name: SERVICE_NAME
          value: {{ .Values.support.serviceName | quote }}
        - name: SUPPORT_DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.existingSecret | default (printf "%s-secrets" (include "pitch.fullname" .)) }}
              key: support-database-url
        - name: REDIS_URL
          value: {{ include "pitch.redis.connectionString" . | quote }}
        - name: RABBITMQ_URL
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.existingSecret | default (printf "%s-secrets" (include "pitch.fullname" .)) }}
              key: rabbitmq-url
        resources:
          {{- toYaml .Values.support.resources | nindent 12 }}
{{ end }}


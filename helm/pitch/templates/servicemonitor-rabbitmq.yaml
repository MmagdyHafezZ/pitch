{{- if and .Values.monitoring.enabled .Values.monitoring.serviceMonitor.enabled .Values.rabbitmq.enabled -}}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "pitch.fullname" . }}-rabbitmq
  labels:
    {{- include "pitch.labels" . | nindent 4 }}
    app.kubernetes.io/component: rabbitmq
    {{- with .Values.monitoring.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  selector:
    matchLabels:
      {{- include "pitch.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: rabbitmq
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.monitoring.serviceMonitor.interval }}
{{- end }}

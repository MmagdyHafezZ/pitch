  #   build:
  #     context: .
  #     dockerfile: ./apps/api/Dockerfile
  #   container_name: pitch-api-local
  #   environment:
  #     NODE_ENV: development
  #     # Separate database URLs for each microservice
  #     DATABASE_URL: postgresql://${POSTGRES_USER:-pitch_user}:${POSTGRES_PASSWORD:-pitch_admin}@postgres-auth:5432/pitch_auth
  #     USER_DATABASE_URL: postgresql://${POSTGRES_USER:-pitch_user}:${POSTGRES_PASSWORD:-pitch_admin}@postgres-user:5432/pitch_user
  #     BUSINESS_DATABASE_URL: postgresql://${POSTGRES_USER:-pitch_user}:${POSTGRES_PASSWORD:-pitch_admin}@postgres-business:5432/pitch_business
  #     REDIS_URL: redis://redis:6380
  #     RABBITMQ_URL: amqp://${RABBITMQ_USER:-pitch_admin}:${RABBITMQ_PASSWORD:-pitch_admin}@rabbitmq:5672/${RABBITMQ_VHOST:-pitch_local}
  #     JWT_SECRET: ${JWT_SECRET:-local-dev-secret-key-change-me}
  #     JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-local-dev-refresh-secret-key-change-me}
  #     PORT: 8000
  #   ports:
  #     - "8000:8000"

version: "3.8"

services:
  # =============================================================================
  # Infrastructure Services
  # =============================================================================

  # PostgreSQL - User Service Database
  postgres-user:
    image: postgres:16-alpine
    container_name: pitch-postgres-user
    environment:
      POSTGRES_DB: pitch_user
      POSTGRES_USER: ${POSTGRES_USER:-pitch_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pitch_password}
    ports:
      - "5433:5432"
    volumes:
      - postgres_user_data:/var/lib/postgresql/data
    networks:
      - pitch-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pitch_user} -d pitch_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # PostgreSQL - Simulation Service Database (with pgvector extension)
  postgres-simulation:
    image: pgvector/pgvector:pg16
    container_name: pitch-postgres-simulation
    environment:
      POSTGRES_DB: pitch_simulation
      POSTGRES_USER: ${POSTGRES_USER:-pitch_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pitch_password}
    ports:
      - "5434:5432"
    volumes:
      - postgres_simulation_data:/var/lib/postgresql/data
    networks:
      - pitch-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pitch_user} -d pitch_simulation"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # PostgreSQL - Support Service Database
  postgres-support:
    image: postgres:16-alpine
    container_name: pitch-postgres-support
    environment:
      POSTGRES_DB: pitch_support
      POSTGRES_USER: ${POSTGRES_USER:-pitch_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pitch_password}
    ports:
      - "5435:5432"
    volumes:
      - postgres_support_data:/var/lib/postgresql/data
    networks:
      - pitch-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pitch_user} -d pitch_support"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # PostgreSQL - Analytics Service Database
  postgres-analytics:
    image: postgres:16-alpine
    container_name: pitch-postgres-analytics
    environment:
      POSTGRES_DB: pitch_analytics
      POSTGRES_USER: ${POSTGRES_USER:-pitch_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pitch_password}
    ports:
      - "5436:5432"
    volumes:
      - postgres_analytics_data:/var/lib/postgresql/data
    networks:
      - pitch-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pitch_user} -d pitch_analytics"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # PostgreSQL - CRM Service Database
  postgres-crm:
    image: postgres:16-alpine
    container_name: pitch-postgres-crm
    environment:
      POSTGRES_DB: pitch_crm
      POSTGRES_USER: ${POSTGRES_USER:-pitch_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pitch_password}
    ports:
      - "5437:5432"
    volumes:
      - postgres_crm_data:/var/lib/postgresql/data
    networks:
      - pitch-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pitch_user} -d pitch_crm"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # MongoDB - Simulation Service (for chat/session data)
  mongodb:
    image: mongo:7-jammy
    container_name: pitch-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-admin_password}
      MONGO_INITDB_DATABASE: pitch_simulation
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - pitch-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: pitch-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - pitch-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    restart: unless-stopped

  # RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: pitch-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-admin123}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-pitch}
    ports:
      - "5672:5672" # AMQP port
      - "15672:15672" # Management UI
      - "15692:15692" # Prometheus metrics
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - pitch-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # =============================================================================
  # Microservices
  # =============================================================================

  # API Gateway
  gateway:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    image: pitch-api:latest
    container_name: pitch-gateway
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      SERVICE_NAME: gateway
      PORT: 8000

      # JWT Configuration
      JWT_SECRET: ${JWT_SECRET:-development-secret-change-in-production}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION:-15m}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-7d}

      # RabbitMQ
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-admin}:${RABBITMQ_PASSWORD:-admin123}@rabbitmq:5672/${RABBITMQ_VHOST:-pitch}

      # Redis
      REDIS_URL: redis://redis:6379

      # CORS
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    ports:
      - "8000:8000"
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pitch-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # User Microservice
  user:
    image: pitch-api:latest
    container_name: pitch-user-service
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      SERVICE_NAME: user

      # Database
      USER_DATABASE_URL: postgresql://${POSTGRES_USER:-pitch_user}:${POSTGRES_PASSWORD:-pitch_password}@postgres-user:5432/pitch_user

      # RabbitMQ
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-admin}:${RABBITMQ_PASSWORD:-admin123}@rabbitmq:5672/${RABBITMQ_VHOST:-pitch}

      # Redis
      REDIS_URL: redis://redis:6379

      # JWT (for token generation)
      JWT_SECRET: ${JWT_SECRET:-development-secret-change-in-production}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION:-15m}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-7d}

      # OAuth Providers
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET}
      MICROSOFT_CALLBACK_URL: ${MICROSOFT_CALLBACK_URL}
    depends_on:
      postgres-user:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      gateway:
        condition: service_started
    networks:
      - pitch-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Simulation Microservice
  simulation:
    image: pitch-api:latest
    container_name: pitch-simulation-service
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      SERVICE_NAME: simulation

      # Databases
      SIMULATION_DATABASE_URL: postgresql://${POSTGRES_USER:-pitch_user}:${POSTGRES_PASSWORD:-pitch_password}@postgres-simulation:5432/pitch_simulation
      MONGODB_URL: mongodb://${MONGO_USER:-admin}:${MONGO_PASSWORD:-admin_password}@mongodb:27017/pitch_simulation?authSource=admin

      # RabbitMQ
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-admin}:${RABBITMQ_PASSWORD:-admin123}@rabbitmq:5672/${RABBITMQ_VHOST:-pitch}

      # Redis
      REDIS_URL: redis://redis:6379

      # AI/LLM Configuration
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}

      # Voice/Video
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY}
    depends_on:
      postgres-simulation:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      gateway:
        condition: service_started
    networks:
      - pitch-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # Support Microservice
  support:
    image: pitch-api:latest
    container_name: pitch-support-service
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      SERVICE_NAME: support

      # Database
      SUPPORT_DATABASE_URL: postgresql://${POSTGRES_USER:-pitch_user}:${POSTGRES_PASSWORD:-pitch_password}@postgres-support:5432/pitch_support

      # RabbitMQ
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-admin}:${RABBITMQ_PASSWORD:-admin123}@rabbitmq:5672/${RABBITMQ_VHOST:-pitch}

      # Redis
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres-support:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      gateway:
        condition: service_started
    networks:
      - pitch-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Analytics Microservice
  analytics:
    image: pitch-api:latest
    container_name: pitch-analytics-service
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      SERVICE_NAME: analytics

      # Database
      ANALYTICS_DATABASE_URL: postgresql://${POSTGRES_USER:-pitch_user}:${POSTGRES_PASSWORD:-pitch_password}@postgres-analytics:5432/pitch_analytics

      # RabbitMQ
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-admin}:${RABBITMQ_PASSWORD:-admin123}@rabbitmq:5672/${RABBITMQ_VHOST:-pitch}

      # Redis
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres-analytics:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      gateway:
        condition: service_started
    networks:
      - pitch-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # LTI Microservice (No database - handles LTI protocol only)
  lti:
    image: pitch-api:latest
    container_name: pitch-lti-service
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      SERVICE_NAME: lti

      # RabbitMQ
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-admin}:${RABBITMQ_PASSWORD:-admin123}@rabbitmq:5672/${RABBITMQ_VHOST:-pitch}

      # Redis
      REDIS_URL: redis://redis:6379

      # LTI Configuration
      LTI_PLATFORM_URL: ${LTI_PLATFORM_URL}
      LTI_CLIENT_ID: ${LTI_CLIENT_ID}
      LTI_DEPLOYMENT_ID: ${LTI_DEPLOYMENT_ID}
      LTI_KEY_SET_URL: ${LTI_KEY_SET_URL}
      LTI_AUTH_TOKEN_URL: ${LTI_AUTH_TOKEN_URL}
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      gateway:
        condition: service_started
    networks:
      - pitch-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # S3 Microservice (No database - handles file storage only)
  s3:
    image: pitch-api:latest
    container_name: pitch-s3-service
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      SERVICE_NAME: s3

      # RabbitMQ
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-admin}:${RABBITMQ_PASSWORD:-admin123}@rabbitmq:5672/${RABBITMQ_VHOST:-pitch}

      # Redis
      REDIS_URL: redis://redis:6379

      # AWS S3 Configuration
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      gateway:
        condition: service_started
    networks:
      - pitch-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # CRM Microservice
  crm:
    image: pitch-api:latest
    container_name: pitch-crm-service
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      SERVICE_NAME: crm

      # Database
      CRM_DATABASE_URL: postgresql://${POSTGRES_USER:-pitch_user}:${POSTGRES_PASSWORD:-pitch_password}@postgres-crm:5432/pitch_crm

      # RabbitMQ
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-admin}:${RABBITMQ_PASSWORD:-admin123}@rabbitmq:5672/${RABBITMQ_VHOST:-pitch}

      # Redis
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres-crm:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      gateway:
        condition: service_started
    networks:
      - pitch-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres_user_data:
  postgres_simulation_data:
  postgres_support_data:
  postgres_analytics_data:
  postgres_crm_data:
  mongodb_data:
  redis_data:
  rabbitmq_data:

# =============================================================================
# Networks
# =============================================================================
networks:
  pitch-network:
    driver: bridge

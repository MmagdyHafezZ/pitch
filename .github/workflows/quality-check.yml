name: Quality Check

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-check:
    name: Code Quality Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        node-version: [20]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: pnpm/action-setup@v3
        with:
          version: 10
          run_install: true

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10.12.4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply formatting
        run: pnpm format

      - name: Run linting
        run: pnpm lint

      - name: Run type checking
        run: pnpm type-check

      - name: Run tests
        run: pnpm test --passWithNoTests

      - name: Build applications
        run: pnpm build

      - name: Check commit message (on push)
        if: github.event_name == 'push'
        run: |
          echo "Checking commit message format..."
          # Get the commit message from the latest commit
          COMMIT_MSG=$(git log -1 --pretty=format:"%s")
          echo "Commit message: $COMMIT_MSG"
          # Run commitlint on the commit message
          echo "$COMMIT_MSG" | pnpm exec commitlint

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: pnpm/action-setup@v3
        with:
          version: 10
          run_install: true

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10.12.4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run security audit
        run: pnpm audit --audit-level moderate

      - name: Check for known vulnerabilities
        run: |
          if pnpm audit --json | jq '.advisories | length' | grep -v "^0$"; then
            echo "⚠️ Security vulnerabilities found!"
            pnpm audit
            exit 1
          else
            echo "✅ No security vulnerabilities found"
          fi

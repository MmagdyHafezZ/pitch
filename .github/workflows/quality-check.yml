name: Quality Check

on:
  push:
    branches: [main, develop, init-version-1]
  pull_request:
    branches: [main, develop, init-version-1]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-check:
    name: Code Quality Check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "pnpm"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          HUSKY: 0
        timeout-minutes: 10

      - name: Generate Prisma clients
        run: pnpm run --filter=api db:generate:all
        continue-on-error: true

      - name: Apply formatting
        run: pnpm format

      - name: Run linting
        run: pnpm lint

      - name: Run type checking
        run: pnpm type-check

      - name: Run tests
        run: pnpm test
        continue-on-error: true

      - name: Build applications
        run: pnpm build

      - name: Check commit message (on push)
        if: github.event_name == 'push'
        run: |
          echo "Checking commit message format..."
          # Get the commit message from the latest commit
          COMMIT_MSG=$(git log -1 --pretty=format:"%s")
          echo "Commit message: $COMMIT_MSG"
          # Run commitlint on the commit message
          echo "$COMMIT_MSG" | pnpm exec commitlint

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "pnpm"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          HUSKY: 0
        timeout-minutes: 10

      - name: Run security audit
        run: pnpm audit --audit-level moderate
        continue-on-error: true

      - name: Run detect-secrets scan
        run: |
          echo "🔍 Running secrets detection scan..."
          pip install git+https://github.com/IBM/detect-secrets.git@0.13.1+ibm.62.dss
          ./scripts/check-secrets.sh
        continue-on-error: true

      - name: Check for known vulnerabilities
        run: |
          echo "🔍 Checking for security vulnerabilities..."
          pnpm audit --json > audit-results.json || true

          if [ -s audit-results.json ]; then
            echo "📊 Audit results found, analyzing..."
            if jq -e '.advisories and (.advisories | length > 0)' audit-results.json >/dev/null; then
              echo "⚠️ Security vulnerabilities found!"
              pnpm audit
              echo "Note: This is informational - vulnerabilities should be addressed but won't fail the build"
            else
              echo "✅ No security vulnerabilities found"
            fi
          else
            echo "✅ No audit results - likely no vulnerabilities"
          fi
        continue-on-error: true

name: Build All Services

on:
  push:
    branches:
      - main
    tags:
      - "*"
    paths:
      - "packages/shared-backend/**"
      - "apps/api/**"
      - "apps/web/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "turbo.json"
      - ".github/workflows/build-all-services.yml"
  pull_request:
    branches:
      - main
      - init-version-1
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      suffix:
        description: Custom suffix for tag
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ENABLE_CODE_SCANNING: ${{ vars.ENABLE_CODE_SCANNING || 'false' }}
  NODE_VERSION: "20"
  PNPM_VERSION: "9"

jobs:
  setup:
    name: Setup & Change Detection
    runs-on: ubuntu-latest
    outputs:
      # We output a JSON array of services to run (e.g. '["api", "web"]')
      services: ${{ steps.determine.outputs.services }}
      # We keep these boolean outputs for the build-images jobs logic
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'packages/shared-backend/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'turbo.json'
              - '.github/workflows/build-all-services.yml'
            web:
              - 'apps/web/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'turbo.json'
              - '.github/workflows/build-all-services.yml'

      - name: Determine services to process
        id: determine
        run: |
          # 1. Get the list of changed services from paths-filter (e.g. '["api"]')
          DETECTED='${{ steps.filter.outputs.changes }}'

          # 2. Check if we should force run ALL services (Schedule, Workflow Dispatch, or Tag)
          if [[ "${{ github.event_name }}" == "schedule" || "${{ github.event_name }}" == "workflow_dispatch" || "${{ github.ref }}" == refs/tags/* ]]; then
            echo "Running ALL services (forced trigger)"
            FINAL_LIST='["api", "web"]'
          else
            echo "Running detected services only"
            FINAL_LIST=$DETECTED
          fi

          # 3. Handle empty list case (prevent empty matrix error)
          if [[ "$FINAL_LIST" == "[]" ]]; then
             echo "No services changed. Setting empty matrix."
             # If empty, we pass a dummy value or handle it. 
             # However, GHA handles empty matrix by skipping the job usually.
             # To be safe, we print it.
          fi

          echo "services=$FINAL_LIST" >> $GITHUB_OUTPUT

  lint:
    name: Lint - ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: setup
    # Skip if the list is empty
    if: needs.setup.outputs.services != '[]'
    strategy:
      fail-fast: false
      matrix:
        # Feed the JSON list directly here
        service: ${{ fromJSON(needs.setup.outputs.services) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node & pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Run linting
        run: pnpm turbo run lint --filter=${{ matrix.service }}

  type-check:
    name: Type Check - ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: setup
    if: needs.setup.outputs.services != '[]'
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.setup.outputs.services) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node & pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Generate Prisma clients (API only)
        if: matrix.service == 'api'
        run: pnpm run --filter=api db:generate:all

      - name: Run type checking
        run: pnpm turbo run type-check --filter=${{ matrix.service }}

  test:
    name: Test - ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: setup
    if: needs.setup.outputs.services != '[]'
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.setup.outputs.services) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node & pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Generate Prisma clients (API only)
        if: matrix.service == 'api'
        run: pnpm run --filter=api db:generate:all

      - name: Run tests
        run: pnpm turbo run test --filter=${{ matrix.service }}

  security-scan:
    name: Security Scan - ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [setup, lint, type-check, test]
    if: needs.setup.outputs.services != '[]'
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.setup.outputs.services) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node & pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Run filesystem security scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: "fs"
          scan-ref: "apps/${{ matrix.service }}"
          format: "sarif"
          output: "trivy-fs-${{ matrix.service }}.sarif"
          severity: "HIGH,CRITICAL"
        continue-on-error: true

      - name: Display filesystem scan results
        run: |
          echo "🔍 Security Scan Results for ${{ matrix.service }}"
          docker run --rm -v "$PWD:/workspace" aquasec/trivy:0.58.1 fs \
            --format table \
            --severity HIGH,CRITICAL \
            /workspace/apps/${{ matrix.service }} || true
        continue-on-error: true

      - name: Run dependency audit
        run: |
          echo "🔍 Dependency Audit for ${{ matrix.service }}"
          pnpm audit --prod --json > pnpm-audit-${{ matrix.service }}.json || true
          pnpm audit --prod || true
        continue-on-error: true

      - name: Upload security scan to GitHub
        if: always() && env.ENABLE_CODE_SCANNING == 'true' && github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: "trivy-fs-${{ matrix.service }}.sarif"
          category: trivy-fs-${{ matrix.service }}

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports-${{ matrix.service }}-${{ github.run_number }}
          path: |
            trivy-fs-${{ matrix.service }}.sarif
            pnpm-audit-${{ matrix.service }}.json
          retention-days: 30

  # ... The rest of the jobs (build-images-api, build-images-web, deploy) stay exactly the same ...
  # They already use 'needs.setup.outputs.api' which we preserved in the setup job.

  build-images-api:
    name: Build Image - API
    runs-on: ubuntu-latest
    needs: [setup, security-scan]
    if: |
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))) &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || needs.setup.outputs.api == 'true')
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      image-tag: ${{ steps.meta.outputs.image-tag }}
      image-digest: ${{ steps.build-push.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          SHORT_SHA=$(git rev-parse --short HEAD)

          if [[ $GITHUB_REF == refs/tags/* ]]; then
            IMAGE_TAG="${GITHUB_REF#refs/tags/}"
          else
            IMAGE_TAG="main-${SHORT_SHA}"
          fi

          if [ -n "${{ github.event.inputs.suffix }}" ]; then
            IMAGE_TAG="${IMAGE_TAG}-${{ github.event.inputs.suffix }}"
          fi

          echo "image-tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "repo-lower=${REPO_LOWER}" >> $GITHUB_OUTPUT

      - name: Build and push image
        uses: docker/build-push-action@v6
        id: build-push
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.repo-lower }}/pitch-api:${{ steps.meta.outputs.image-tag }}
            ghcr.io/${{ steps.meta.outputs.repo-lower }}/pitch-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
          platforms: linux/amd64
          build-args: NODE_VERSION=${{ env.NODE_VERSION }}

      - name: Run container security scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ghcr.io/${{ steps.meta.outputs.repo-lower }}/pitch-api:${{ steps.meta.outputs.image-tag }}
          format: "sarif"
          output: "trivy-container-api.sarif"
          severity: "HIGH,CRITICAL"
        continue-on-error: true

      - name: Display container scan results
        run: |
          echo "🔍 Container Security Scan for API"
          docker run --rm aquasec/trivy:0.58.1 image \
            --format table \
            --severity HIGH,CRITICAL \
            ghcr.io/${{ steps.meta.outputs.repo-lower }}/pitch-api:${{ steps.meta.outputs.image-tag }} || true
        continue-on-error: true

      - name: Upload container security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-security-api-${{ github.run_number }}
          path: trivy-container-api.sarif
          retention-days: 30

      - name: Generate attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ghcr.io/${{ steps.meta.outputs.repo-lower }}/pitch-api
          subject-digest: ${{ steps.build-push.outputs.digest }}
          push-to-registry: true

      - name: Save image metadata
        run: |
          mkdir -p artifacts
          echo "${{ steps.meta.outputs.image-tag }}" > artifacts/api-image-tag.txt
          echo "${{ steps.build-push.outputs.digest }}" > artifacts/api-image-digest.txt

      - name: Upload image metadata
        uses: actions/upload-artifact@v4
        with:
          name: api-image-metadata
          path: artifacts/
          retention-days: 7

  build-images-web:
    name: Build Image - Web
    runs-on: ubuntu-latest
    needs: [setup, security-scan]
    if: |
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))) &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || needs.setup.outputs.web == 'true')
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      image-tag: ${{ steps.meta.outputs.image-tag }}
      image-digest: ${{ steps.build-push.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          SHORT_SHA=$(git rev-parse --short HEAD)

          if [[ $GITHUB_REF == refs/tags/* ]]; then
            IMAGE_TAG="${GITHUB_REF#refs/tags/}"
          else
            IMAGE_TAG="main-${SHORT_SHA}"
          fi

          if [ -n "${{ github.event.inputs.suffix }}" ]; then
            IMAGE_TAG="${IMAGE_TAG}-${{ github.event.inputs.suffix }}"
          fi

          echo "image-tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "repo-lower=${REPO_LOWER}" >> $GITHUB_OUTPUT

      - name: Build and push image
        uses: docker/build-push-action@v6
        id: build-push
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.repo-lower }}/pitch-web:${{ steps.meta.outputs.image-tag }}
            ghcr.io/${{ steps.meta.outputs.repo-lower }}/pitch-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
          platforms: linux/amd64
          build-args: NODE_VERSION=${{ env.NODE_VERSION }}

      - name: Run container security scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ghcr.io/${{ steps.meta.outputs.repo-lower }}/pitch-web:${{ steps.meta.outputs.image-tag }}
          format: "sarif"
          output: "trivy-container-web.sarif"
          severity: "HIGH,CRITICAL"
        continue-on-error: true

      - name: Display container scan results
        run: |
          echo "🔍 Container Security Scan for Web"
          docker run --rm aquasec/trivy:0.58.1 image \
            --format table \
            --severity HIGH,CRITICAL \
            ghcr.io/${{ steps.meta.outputs.repo-lower }}/pitch-web:${{ steps.meta.outputs.image-tag }} || true
        continue-on-error: true

      - name: Upload container security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-security-web-${{ github.run_number }}
          path: trivy-container-web.sarif
          retention-days: 30

      - name: Generate attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ghcr.io/${{ steps.meta.outputs.repo-lower }}/pitch-web
          subject-digest: ${{ steps.build-push.outputs.digest }}
          push-to-registry: true

      - name: Save image metadata
        run: |
          mkdir -p artifacts
          echo "${{ steps.meta.outputs.image-tag }}" > artifacts/web-image-tag.txt
          echo "${{ steps.build-push.outputs.digest }}" > artifacts/web-image-digest.txt

      - name: Upload image metadata
        uses: actions/upload-artifact@v4
        with:
          name: web-image-metadata
          path: artifacts/
          retention-days: 7

  deploy:
    name: Deploy Services
    runs-on: ubuntu-latest
    needs: [setup, build-images-api, build-images-web]
    if: |
      always() &&
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))) &&
      (needs.build-images-api.result == 'success' || needs.build-images-web.result == 'success')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download API metadata
        if: needs.build-images-api.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: api-image-metadata
          path: api-metadata/
        continue-on-error: true

      - name: Download Web metadata
        if: needs.build-images-web.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: web-image-metadata
          path: web-metadata/
        continue-on-error: true

      - name: Read image metadata
        id: metadata
        run: |
          if [ -f "api-metadata/api-image-tag.txt" ]; then
            API_TAG=$(cat api-metadata/api-image-tag.txt)
            echo "api-tag=${API_TAG}" >> $GITHUB_OUTPUT
            echo "✅ API image tag: ${API_TAG}"
          fi

          if [ -f "web-metadata/web-image-tag.txt" ]; then
            WEB_TAG=$(cat web-metadata/web-image-tag.txt)
            echo "web-tag=${WEB_TAG}" >> $GITHUB_OUTPUT
            echo "✅ Web image tag: ${WEB_TAG}"
          fi

      - name: Deploy API
        if: needs.build-images-api.result == 'success'
        run: |
          echo "🚀 Deploying API with tag: ${{ steps.metadata.outputs.api-tag }}"
          echo "Add your API deployment commands here"
          # kubectl set image deployment/api api=ghcr.io/owner/pitch-api:${{ steps.metadata.outputs.api-tag }}
          # helm upgrade --install api ./charts/api --set image.tag=${{ steps.metadata.outputs.api-tag }}

      - name: Deploy Web
        if: needs.build-images-web.result == 'success'
        run: |
          echo "🚀 Deploying Web with tag: ${{ steps.metadata.outputs.web-tag }}"
          echo "Add your Web deployment commands here"
          # kubectl set image deployment/web web=ghcr.io/owner/pitch-web:${{ steps.metadata.outputs.web-tag }}
          # helm upgrade --install web ./charts/web --set image.tag=${{ steps.metadata.outputs.web-tag }}

  summary:
    name: Workflow Summary
    runs-on: ubuntu-latest
    needs:
      [setup, lint, type-check, test, security-scan, build-images-api, build-images-web, deploy]
    if: always()
    steps:
      - name: Generate summary
        run: |
          echo "# Workflow Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Trigger Information" >> $GITHUB_STEP_SUMMARY
          echo "- Event: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- Ref: ${{ github.ref }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Service Changes Detected" >> $GITHUB_STEP_SUMMARY
          echo "- API: ${{ needs.setup.outputs.api }}" >> $GITHUB_STEP_SUMMARY
          echo "- Web: ${{ needs.setup.outputs.web }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Stage Results" >> $GITHUB_STEP_SUMMARY
          echo "- Setup: ${{ needs.setup.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Lint: ${{ needs.lint.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Type Check: ${{ needs.type-check.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Test: ${{ needs.test.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Security Scan: ${{ needs.security-scan.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Build Images API: ${{ needs.build-images-api.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Build Images Web: ${{ needs.build-images-web.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Deploy: ${{ needs.deploy.result }}" >> $GITHUB_STEP_SUMMARY

name: Build All Services

on:
  push:
    branches:
      - main
    tags:
      - "*"
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "turbo.json"
      - ".github/workflows/build-all-services.yml"
  pull_request:
    branches:
      - main
      - init-version-1
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      suffix:
        description: Custom suffix for tag
        required: false
  repository_dispatch:


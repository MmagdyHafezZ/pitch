# Configuration for detect-secrets
filters_used:
  - filename: detect_secrets.filters.allowlist.is_line_allowlisted
  - filename: detect_secrets.filters.common.is_baseline_file
  - filename: detect_secrets.filters.common.is_ignored_due_to_verification_policies
  - filename: detect_secrets.filters.heuristic.is_indirect_reference
  - filename: detect_secrets.filters.heuristic.is_likely_id_string
  - filename: detect_secrets.filters.heuristic.is_lock_file
  - filename: detect_secrets.filters.heuristic.is_not_alphanumeric_string
  - filename: detect_secrets.filters.heuristic.is_potential_uuid
  - filename: detect_secrets.filters.heuristic.is_prefixed_with_dollar_sign
  - filename: detect_secrets.filters.heuristic.is_sequential_string
  - filename: detect_secrets.filters.heuristic.is_swagger_file
  - filename: detect_secrets.filters.heuristic.is_templated_secret

plugins_used:
  - name: ArtifactoryDetector
  - name: AWSKeyDetector
  - name: AzureStorageKeyDetector
  - name: Base64HighEntropyString
    limit: 4.5
  - name: BasicAuthDetector
  - name: CloudantDetector
  - name: DiscordBotTokenDetector
  - name: GitHubTokenDetector
  - name: HexHighEntropyString
    limit: 3.0
  - name: IbmCloudIamDetector
  - name: IbmCosHmacDetector
  - name: JwtTokenDetector
  - name: KeywordDetector
    keyword_exclude: |
      (?i)^(example|sample|test|demo|placeholder)$
  - name: MailchimpDetector
  - name: NpmDetector
  - name: PrivateKeyDetector
  - name: SendGridDetector
  - name: SlackDetector
  - name: SoftlayerDetector
  - name: SquareOAuthDetector
  - name: StripeDetector
  - name: TwilioKeyDetector

exclude_files: |
  ^\.secrets\.baseline$
  ^\.env\.example$
  ^pnpm-lock\.yaml$
  ^package-lock\.json$
  ^yarn\.lock$
  ^.*\.min\.(js|css)$
  ^.*\.map$
  ^.*\.log$
  ^\.git/.*$
  ^\.husky/_/.*$
  ^node_modules/.*$
  ^apps/.*/node_modules/.*$
  ^apps/.*/dist/.*$
  ^apps/.*/build/.*$
  ^apps/.*/.next/.*$
  ^apps/.*/coverage/.*$
  ^apps/.*/prisma/migrations/.*$
  ^apps/.*/prisma/generated/.*$
  ^docker/.*$
  ^docs/.*\.md$
  ^\.vscode/.*$
  ^\.idea/.*$
  ^.*\.ico$
  ^.*\.(png|jpg|jpeg|gif|svg|webp)$
  ^.*\.(woff|woff2|ttf|eot)$
  ^.*\.pdf$

version: 1.5.0